<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fireside Infograph</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2 class="page-title">FIRESIDE INFOGRAPH.</h2>

  <div id="infograph-container">
    <!-- 1) INPUT FIELDS -->
    <div id="input-fields">
      <div class="styled-table">
        <div class="field">
          <label for="user-name">Name or Discord</label>
          <input type="text" id="user-name" autocomplete="name" placeholder="Enter name..." />
        </div>
        <div class="field">
          <label for="age">Age</label>
          <div class="picker-wrap" data-picker="age">
            <input type="text" id="age" readonly placeholder="--" autocomplete="off" />
            <div class="picker-dropdown"></div>
          </div>
        </div>
        <div class="field">
          <label for="biological-sex">Gender</label>
          <input type="text" id="biological-sex" autocomplete="sex" placeholder="Enter gender..." />
        </div>
        <div class="field">
          <label for="sexual-orientation">Orientation</label>
          <input type="text" id="sexual-orientation" placeholder="Enter orientation..." />
        </div>
        <div class="field">
          <label for="mbti">Personality Type</label>
          <div class="picker-wrap" data-picker="mbti">
            <input type="text" id="mbti" readonly placeholder="--" autocomplete="off" />
            <div class="picker-dropdown"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2) CONTROLS -->
    <div id="controls-bar">
      <div id="color-palette">
        <!-- 3 contrast swatches injected by JS -->
        <input id="color-picker" type="color" value="#FF6B6B" />
        <button id="custom-color-btn" type="button" class="custom-color-trigger" title="Pick any color" aria-label="Pick a custom color">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
        </button>
      </div>

      <span class="controls-sep" aria-hidden="true"></span>

      <div class="controls-actions">
        <button id="clear-button" type="button" aria-label="Clear filled boxes">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M6 19c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V7H6v12zm3-10h2v8H9v-8zm4 0h2v8h-2v-8zM15.5 4l-1-1h-5l-1 1H5v2h14V4h-3.5z" fill="currentColor"/>
          </svg>
          <span>Clear</span>
        </button>

        <button id="dark-mode-toggle"
                type="button"
                aria-label="Toggle dark mode"
                aria-pressed="false">
          <svg class="icon icon-moon" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8C13.06 3.04 12.54 3 12 3z"/>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
          </svg>
          <span class="label-moon">Dark</span>
          <span class="label-sun">Light</span>
        </button>

        <div class="tooltip-wrapper">
          <button id="save-button"
                  type="button"
                  aria-label="Save infographic as image"
                  disabled>
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M20 5h-3.17l-1.84-2H9L7.17 5H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V7c0-1.11-.89-2-2-2zM12 17a5 5 0 110-10 5 5 0 010 10z" fill="currentColor"/>
            </svg>
            <span>Save</span>
          </button>
          <span class="tooltip-text">Fill in all fields first</span>
        </div>
      </div>
    </div>

    <!-- 3) BOX GRID -->
    <div id="box-container">
      <div class="box-row">
        <h3 class="category" data-desc="How smart are you compared to the average person?">Intelligence</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How wealthy are you compared to the average person?">Wealth</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How's your sex life compared to the average person?">Sex Life</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How attractive are you compared to the average person?">Physical Appearance</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How likeable is your personality compared to the average person?">Personality</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How confident are you compared to the average person?">Confidence</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How active is your social life compared to the average person?">Social Life</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How healthy and fit are you compared to the average person?">Health / Fitness</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How happy are you compared to the average person?">Happiness</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
      <div class="box-row">
        <h3 class="category" data-desc="How cringey are you compared to the average person?">Cringiness</h3>
        <div class="boxes">
          <div class="box" title="1/10"></div><div class="box" title="2/10"></div><div class="box" title="3/10"></div>
          <div class="box" title="4/10"></div><div class="box" title="5/10"></div><div class="box" title="6/10"></div>
          <div class="box" title="7/10"></div><div class="box" title="8/10"></div><div class="box" title="9/10"></div>
          <div class="box bonus-box" title="10/10"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
